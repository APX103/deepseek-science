description = "Deepseek Science tool system (Tool trait, registry, router, built-in tools)"

[features]
test-support = ["dss-a2a/test-support"]

[dependencies]
dss-core = { path = "../dss-core" }
dss-a2a = { path = "../dss-a2a" }
dss-skills = { path = "../dss-skills" }
dss-mcp = { path = "../dss-mcp" }
dss-llm = { path = "../dss-llm" }
dss-memory = { path = "../dss-memory" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
reqwest.workspace = true
libc.workspace = true

[dev-dependencies]
axum.workspace = true

[[test]]
name = "agent_registry_a2a_e2e"
path = "tests/agent_registry_a2a_e2e.rs"
