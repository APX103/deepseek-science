[workspace]
resolver = "2"
members = [
    "crates/dss-core",
    "crates/dss-llm",
    "crates/dss-tools",
    "crates/dss-db",
    "crates/dss-compact",
    "crates/dss-skills",
    "crates/dss-memory",
    "crates/dss-mcp",
    "crates/dss-observability",
    "crates/dss-agent",
    "crates/dss-api",
    "crates/dss-bin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "process", "fs", "io-util", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
deadpool-sqlite = "0.8"
deadpool = { version = "0.12", features = ["managed", "rt_tokio_1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
include_dir = "0.7"
